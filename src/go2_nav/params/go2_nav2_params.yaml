# Nav2 parameters for Unitree Go2 robot with RTAB-Map VSLAM
# Uses visual odometry from rtabmap (/vo) and segmented point clouds from camera
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /vo
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # Jetson: 20 Hz can warn under load; 15 Hz is usually enough for Go2-sized robots
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    # Non-holonomic / cmd_vel vy = 0; keep low (upstream TurtleBot-style 0.5 is for holonomic noise)
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # PoseProgressChecker: counts rotation as progress (DWB often rotates before translating).
    # SimpleProgressChecker only looks at XY and triggers "Failed to make progress" during spin-in-place.
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.2
      required_movement_angle: 0.4
      movement_time_allowance: 25.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3  # meters (planar distance to goal XY)
      yaw_goal_tolerance: 0.7853981633974483  # radians (45 deg)
    # DWB parameters - adjusted for Go2 quadruped
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0          # m/s (no reverse motion)
      min_vel_y: 0.0          # m/s
      max_vel_x: 0.2          # m/s
      max_vel_y: 0.0          # m/s
      max_vel_theta: 0.15     # rad/s
      min_speed_xy: 0.0       # m/s (magnitude in xy plane)
      max_speed_xy: 0.2       # m/s (>= hypot(max_vel_x, max_vel_y))
      min_speed_theta: 0.0    # rad/s
      acc_lim_x: 0.04         # m/s^2 (0.2/0.04 = 5.0s to max vx from rest)
      acc_lim_y: 0.0          # m/s^2
      acc_lim_theta: 0.03     # rad/s^2 (0.15/0.03 = 5.0s to max w from rest)
      decel_lim_x: -0.20      # m/s^2 (0.2/0.20 = 1.0s from max vx to 0)
      decel_lim_y: 0.0        # m/s^2
      decel_lim_theta: -0.15  # rad/s^2 (0.15/0.15 = 1.0s from max w to 0)
      vx_samples: 20         # count (DWB samples along x velocity)
      vy_samples: 1           # count (fixed vy=0)
      vtheta_samples: 10      # count (DWB samples along angular velocity)
      sim_time: 10.0           # s (forward simulation horizon for each candidate trajectory)
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Higher = stronger penalty for trajectories that pass through inflated
      # cost cells, so DWB chooses paths that hug the corridor centerline.
      BaseObstacle.scale: 0.20
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      # Higher rate → Livox clearing/mark rays apply sooner (snappier obstacle fade).
      update_frequency: 10.0
      publish_frequency: 10.0
      # RTAB-Map rgbd_odometry uses frame "vo", not "odom"
      global_frame: vo
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      # 5x5 m gives 2.5 m radius around the robot (corner reach ~3.5 m).
      # ~10k cells per layer.
      width: 5
      height: 5
      resolution: 0.05
      # Go2 rectangular footprint with 1.2x safety margin around base_link.
      # Body size 0.70 x 0.31 m; base_link sits 10 cm behind the head:
      #   raw corners [[0.10, +/-0.155], [-0.60, +/-0.155]]
      #   1.2x scaled [[0.12, +/-0.186], [-0.72, +/-0.186]]
      # Final width chosen 0.216 (slightly more lateral margin for IMU/odom drift).
      # Corner order: [front-left, rear-left, rear-right, front-right] (CCW).
      footprint: "[[0.12, 0.216], [-0.72, 0.216], [-0.72, -0.216], [0.12, -0.216]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Lower factor = gentler cost decay over `inflation_radius`, so the
        # planner/controller more strongly prefer the centerline of free space.
        cost_scaling_factor: 2.0
        # 1.0 m halo around every obstacle cell. Robot footprint extends ~0.72 m
        # behind base_link, so this keeps clearance >= 0.28 m from the body.
        inflation_radius: 1.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Always wipe cells inside the robot footprint each tick — protects
        # against any leg/body returns that slip past min_obstacle_height.
        footprint_clearing_enabled: True
        # 2D obstacle layer generally clears moving-object ghosts better than
        # VoxelLayer for sparse non-repetitive LiDAR patterns.
        # Single source: Livox MID-360 PointCloud2 in livox_frame.
        # TF chain (base_link -> livox_frame) is published by livox_mid360.launch.py.
        # Nav2 transforms the cloud into the costmap global_frame (vo) per tick.
        observation_sources: livox
        livox:
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # Do not keep old clouds in the observation buffer; this helps
          # moving obstacles disappear from old positions quickly.
          clear_after_reading: True
          # Keep only fresh measurements for this source.
          observation_persistence: 0.0
          expected_update_rate: 0.2
          # Drop returns whose z (vo frame) is below 5 cm — filters the floor,
          # the dog's own body, and the lowest part of clutter. Cap at 1.5 m
          # to skip ceilings / hanging fixtures.
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          # 5x5 m costmap (corner reach ~3.5 m). Raytrace covers the whole
          # costmap; marking is a hair shorter so the very edge isn't
          # populated from a single noisy return.
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          # Treat "no return" rays as invalid (don't clear out to max range).
          inf_is_valid: false
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Was 1 Hz: ghost obstacles linger after the robot moves. 5 Hz clears much faster;
      # raise toward 10 Hz if CPU allows and you still see sticky dynamics.
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # Match local costmap footprint (1.2x Go2 rectangle, base_link near head).
      # See local_costmap above for derivation.
      footprint: "[[0.12, 0.216], [-0.72, 0.216], [-0.72, -0.216], [0.12, -0.216]]"
      resolution: 0.05
      # false: unmapped cells from /map are treated as free on this costmap (do not route around "unknown").
      # true: keeps unknown as separate; pair with planner allow_unknown if you want planner-specific behavior.
      track_unknown_space: false
      # Layer order matters: static is the base map, obstacle_layer overlays
      # live Livox detections so the global planner re-routes around dynamic
      # obstacles, then inflation expands the combined cost field.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Wipe cells inside the robot footprint each tick.
        footprint_clearing_enabled: True
        # 2D obstacle layer (cheaper than VoxelLayer for the larger global
        # costmap); height filtering is still applied to the input cloud
        # before it's flattened to 2D. Source params kept identical to the
        # local costmap obstacle_layer below for consistent marking/clearing.
        observation_sources: livox
        livox:
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # Keep this layer strictly on fresh scans so old obstacle positions
          # from moving targets are dropped quickly.
          clear_after_reading: True
          observation_persistence: 0.0
          expected_update_rate: 0.2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Match local costmap inflation so global plan and local plan agree on
        # how far to stay from obstacles.
        cost_scaling_factor: 2.0
        inflation_radius: 1.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # MUST be <= general_goal_checker.xy_goal_tolerance (0.3) — otherwise the
      # planner can produce a path whose endpoint sits up to `tolerance` meters
      # from the goal, the controller follows it perfectly, and the goal_checker
      # then rejects "goal reached" forever (until progress_checker times out).
      tolerance: 0.3
      use_astar: false
      # true: planner may route through unexplored (unknown) map cells.
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    # Match visual odometry frame from rtabmap_odom
    global_frame: vo
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.15
    min_rotational_vel: 0.01
    rotational_acc_lim: 0.15

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 15.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.15]
    min_velocity: [0.0, 0.0, -0.15]
    # Match controller: 5s ramp-up to max (vx 0.2/0.04, w 0.15/0.03);
    # 1s decel from max to 0 (vx 0.2/0.20, w 0.15/0.15).
    max_accel: [0.04, 0.0, 0.03]
    max_decel: [-0.20, 0.0, -0.15]
    odom_topic: "/vo"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
